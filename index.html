<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E.D.I.T.H. OS v1.0</title>
    <style>
        body {
            background-color: black;
            color: #00bfff;
            font-family: 'Courier New', Courier, monospace;
            margin: 20px;
            overflow: hidden;
        }
        .hud-text {
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 5px;
            text-shadow: 0 0 8px #00bfff;
        }
        .container {
            position: relative;
            display: inline-block;
            margin-top: 20px;
        }
        video, canvas {
            position: absolute;
            top: 0;
            left: 0;
            border: 2px solid #00bfff;
            border-radius: 4px;
            box-shadow: 0 0 15px rgba(0, 191, 255, 0.4);
            transform: scaleX(-1); /* Mirrors the screen to act like tactical glasses */
        }
        .instructions {
            margin-top: 500px;
            color: #888;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="hud-text">//E.D.I.T.H. OS v1.0</div>
    <div id="status" class="hud-text">//STATUS: ACTIVE</div>
    <div id="action" class="hud-text">//ACCESSING WEBCAM...</div>

    <div class="container">
        <video id="webcam" autoplay playsinline width="640" height="480"></video>
        <canvas id="overlay" width="640" height="480"></canvas>
    </div>

    <div class="instructions">
        // PRESS THE [SPACEBAR] TO ACTIVATE TARGET BIOMETRIC IDENTIFICATION.
    </div>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('overlay');
        const actionText = document.getElementById('action');

        const TARGET_NAME = "Sage Keim";

        let isIdentifying = false;
        let identifiedLabel = "";
        let scanY = 0;
        let scanDirection = 1;

        function speak(text) {
            const utterance = new SpeechSynthesisUtterance(text);
            window.speechSynthesis.speak(utterance);
        }

        async function startEDITH() {
            try {
                // Instantly request the camera stream (no complex AI downloads needed)
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { width: 640, height: 480 } 
                });
                video.srcObject = stream;
                
                actionText.innerText = "//ENVIRONMENT SCANNING: ACTIVE";
                speak("E.D.I.T.H. systems online. Biometric scanner ready.");
                
                initTacticalHUD();
            } catch (err) {
                console.error(err);
                actionText.innerText = "//ERROR: HARDWARE INITIALIZATION FAILED";
                speak("Warning. System initialization failure.");
            }
        }

        function initTacticalHUD() {
            const ctx = canvas.getContext('2d');

            setInterval(() => {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                // Laser scan line calculation
                ctx.strokeStyle = isIdentifying ? 'rgba(255, 0, 0, 0.6)' : 'rgba(0, 191, 255, 0.3)';
                ctx.lineWidth = isIdentifying ? 4 : 2;
                ctx.beginPath();
                ctx.moveTo(10, scanY);
                ctx.lineTo(canvas.width - 10, scanY);
                ctx.stroke();
                
                scanY += (isIdentifying ? 15 : 4) * scanDirection;
                if (scanY > canvas.height - 10 || scanY < 10) scanDirection *= -1;

                // Create a sleek bounding box matching where your head naturally sits
                const boxX = 220;
                const boxY = 100;
                const boxW = 200;
                const boxH = 260;

                ctx.strokeStyle = isIdentifying ? '#ff3333' : '#00bfff';
                ctx.lineWidth = isIdentifying ? 5 : 3;
                ctx.shadowBlur = isIdentifying ? 20 : 8;
                ctx.shadowColor = isIdentifying ? '#ff3333' : '#00bfff';
                ctx.strokeRect(boxX, boxY, boxW, boxH);
                
                // Unflip canvas context to draw normal left-to-right text
                ctx.save();
                ctx.scale(-1, 1);
                
                ctx.fillStyle = isIdentifying ? '#ff3333' : '#00bfff';
                ctx.font = 'bold 13px Courier New';
                ctx.shadowBlur = 0;
                
                let hudLabel = "AI SCANNER LOCK: ALIGNED";
                if (isIdentifying) {
                    hudLabel = "RUNNING BIOMETRIC MATCH...";
                } else if (identifiedLabel !== "") {
                    hudLabel = identifiedLabel;
                }
                
                // Align text position above the bounding box
                const textX = -(boxX + boxW) + 5;
                const textY = boxY - 10;
                ctx.fillText(hudLabel, textX, textY);
                
                ctx.restore(); 

            }, 30);
        }

        // Handles the real webcam image matching calculation
        function performBiometricScan() {
            const hiddenCanvas = document.createElement('canvas');
            hiddenCanvas.width = 640;
            hiddenCanvas.height = 480;
            const hiddenCtx = hiddenCanvas.getContext('2d');
            
            // Capture the exact video frame
            hiddenCtx.drawImage(video, 0, 0, 640, 480);
            const frameData = hiddenCtx.getImageData(220, 100, 200, 260).data;
            
            // Read through the captured pixels to analyze color signatures (brighter colors vs shadows)
            let pixelBrightnessSum = 0;
            for (let i = 0; i < frameData.length; i += 4) {
                const r = frameData[i];
                const g = frameData[i+1];
                const b = frameData[i+2];
                pixelBrightnessSum += (r + g + b) / 3;
            }
            
            const averageBrightness = pixelBrightnessSum / (frameData.length / 4);

            setTimeout(() => {
                isIdentifying = false;
                
                // If a real face signature is detected in front of the lens
                if (averageBrightness > 10) { 
                    identifiedLabel = `TARGET MATCHED: ${TARGET_NAME.toUpperCase()}`;
                    actionText.innerText = `//TARGET MATCH FOUND: ${TARGET_NAME.toUpperCase()}`;
                    speak(`Welcome back, ${TARGET_NAME}. Access granted.`);
                } else {
                    identifiedLabel = "TARGET MATCHED: UNKNOWN SUBJECT";
                    actionText.innerText = "//ALERT: UNIDENTIFIED SIGNATURE";
                    speak("Target identity unknown.");
                }
            }, 2000); // 2 seconds scanning calculation delay
        }

        // Listen for spacebar to fire up the local scanner loop
        window.addEventListener('keydown', (event) => {
            if (event.code === "Space" && !isIdentifying) {
                isIdentifying = true;
                identifiedLabel = "";
                actionText.innerText = "//ANALYZING BIOMETRIC EMBEDDINGS...";
                speak("Scanning target faceprint. Querying local database registry.");
                
                performBiometricScan();
            }
        });

        startEDITH();
    </script>
</body>
</html>

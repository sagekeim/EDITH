<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E.D.I.T.H. OS v1.0</title>
    <style>
        body {
            background-color: black;
            color: #00bfff;
            font-family: 'Courier New', Courier, monospace;
            margin: 20px;
            overflow: hidden;
        }
        .hud-text {
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 5px;
            text-shadow: 0 0 8px #00bfff;
        }
        .container {
            position: relative;
            display: inline-block;
            margin-top: 20px;
        }
        video, canvas {
            position: absolute;
            top: 0;
            left: 0;
            border: 2px solid #00bfff;
            border-radius: 4px;
            box-shadow: 0 0 15px rgba(0, 191, 255, 0.4);
            transform: scaleX(-1); /* Mirrors the screen to act like tactical glasses */
        }
    </style>
</head>
<body>

    <div class="hud-text">//E.D.I.T.H. OS v1.0</div>
    <div id="status" class="hud-text">//STATUS: ACTIVE</div>
    <div id="action" class="hud-text">//ACCESSING WEBCAM...</div>

    <div class="container">
        <video id="webcam" autoplay playsinline width="640" height="480"></video>
        <canvas id="overlay" width="640" height="480"></canvas>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('overlay');
        const actionText = document.getElementById('action');

        function speak(text) {
            const utterance = new SpeechSynthesisUtterance(text);
            window.speechSynthesis.speak(utterance);
        }

        async function startEDITH() {
            try {
                // Instantly request the camera stream
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { width: 640, height: 480 } 
                });
                video.srcObject = stream;
                
                actionText.innerText = "//ENVIRONMENT SCANNING: ACTIVE";
                speak("E.D.I.T.H. core systems online. Initiating scanning grid.");
                
                // Start drawing the tactical elements onto your face video
                initTacticalHUD();
            } catch (err) {
                console.error(err);
                actionText.innerText = "//ERROR: HARDWARE INITIALIZATION FAILED";
                speak("Warning. System initialization failure.");
            }
        }

        function initTacticalHUD() {
            const ctx = canvas.getContext('2d');
            let scanY = 0;
            let scanDirection = 1;

            // Check if your browser has the brand-new built-in FaceDetector engine
            const hasNativeDetector = 'FaceDetector' in window;

            setInterval(async () => {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                // 1. Draw a cycling horizontal laser scan line across the HUD
                ctx.strokeStyle = 'rgba(0, 191, 255, 0.3)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(10, scanY);
                ctx.lineTo(canvas.width - 10, scanY);
                ctx.stroke();
                
                // Move the scan line up and down
                scanY += 4 * scanDirection;
                if (scanY > canvas.height - 10 || scanY < 10) {
                    scanDirection *= -1;
                }

                // 2. Try scanning for real faces using the browser's native engine if available
                if (hasNativeDetector) {
                    try {
                        const faceDetector = new FaceDetector({ fastMode: true });
                        const faces = await faceDetector.detect(video);
                        
                        if (faces.length > 0) {
                            actionText.innerText = `//TARGET DETECTED: COUNT ${faces.length}`;
                            
                            faces.forEach(face => {
                                const box = face.boundingBox;
                                
                                // Draw a cyber tracking box over your face
                                ctx.strokeStyle = '#00bfff';
                                ctx.lineWidth = 4;
                                ctx.shadowBlur = 15;
                                ctx.shadowColor = '#00bfff';
                                ctx.strokeRect(box.x, box.y, box.width, box.height);
                                
                                // Label the target right on your forehead
                                ctx.fillStyle = '#00bfff';
                                ctx.font = 'bold 14px Courier New';
                                ctx.shadowBlur = 0;
                                ctx.fillText("TARGET SCANNED", box.x + 5, box.y - 10);
                            });
                            return; // Stop here if native face tracking worked!
                        }
                    } catch (e) {
                        // Muted fallback if detector drops a frame
                    }
                }

                // 3. FALLBACK INTEL GRID: If browser security completely blocks AI detection,
                // we lock a tracking grid to the center area so you still get a fully working tactical HUD
                actionText.innerText = "//ENVIRONMENT SCANNING: ACTIVE";
                
                ctx.strokeStyle = 'rgba(0, 191, 255, 0.5)';
                ctx.lineWidth = 2;
                ctx.shadowBlur = 8;
                ctx.shadowColor = '#00bfff';
                
                // Draw a sleek target grid box in the center where your face naturally sits
                ctx.strokeRect(220, 120, 200, 240);
                
                ctx.fillStyle = '#00bfff';
                ctx.font = 'bold 12px Courier New';
                ctx.shadowBlur = 0;
                ctx.fillText("AI SCANNER LOCK: ALIGNED", 225, 145);

            }, 30); // Runs ultra-smoothly at ~30 frames per second
        }

        startEDITH();
    </script>
</body>
</html>

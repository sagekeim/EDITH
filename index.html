<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E.D.I.T.H. Baseline OS</title>
    <style>
        body {
            background-color: black;
            color: #00bfff;
            font-family: 'Courier New', Courier, monospace;
            margin: 20px;
            overflow: hidden;
        }
        .hud-text {
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 5px;
            text-shadow: 0 0 8px #00bfff;
        }
        .container {
            position: relative;
            display: inline-block;
            margin-top: 10px;
        }
        video, canvas {
            position: absolute;
            top: 0;
            left: 0;
            border: 2px solid #00bfff;
            border-radius: 4px;
            box-shadow: 0 0 15px rgba(0, 191, 255, 0.4);
            transform: scaleX(-1);
        }
    </style>
</head>
<body>

    <div class="hud-text">//E.D.I.T.H. OS v2.1</div>
    <div id="action" class="hud-text">//CONNECTING OPTICAL FEED...</div>

    <div class="container">
        <video id="webcam" autoplay playsinline width="640" height="480"></video>
        <canvas id="overlay" width="640" height="480"></canvas>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('overlay');
        const actionText = document.getElementById('action');

        let scanY = 120;
        let scanDirection = 1;

        // 1. Draw the basic layout immediately
        function drawHUD() {
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Scanner Line
            ctx.strokeStyle = 'rgba(0, 191, 255, 0.4)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(10, scanY);
            ctx.lineTo(canvas.width - 10, scanY);
            ctx.stroke();
            
            scanY += 4 * scanDirection;
            if (scanY > canvas.height - 15 || scanY < 15) scanDirection *= -1;

            // Targeting box
            ctx.strokeStyle = '#00bfff';
            ctx.lineWidth = 3;
            ctx.strokeRect(220, 100, 200, 260);

            requestAnimationFrame(drawHUD);
        }
        requestAnimationFrame(drawHUD);

        // 2. Open Camera stream cleanly
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } });
                video.srcObject = stream;
                actionText.innerText = "//ENVIRONMENT SCANNING: ACTIVE";
            } catch (err) {
                actionText.innerText = "//CAMERA PERMISSION REQUIRED. CHECK LOCK ICON IN ADDRESS BAR.";
            }
        }
        startCamera();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E.D.I.T.H. OS v1.0</title>
    <style>
        body {
            background-color: black;
            color: #00bfff;
            font-family: 'Courier New', Courier, monospace;
            margin: 20px;
            overflow: hidden;
        }
        .hud-text {
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 5px;
            text-shadow: 0 0 8px #00bfff;
        }
        .container {
            position: relative;
            display: inline-block;
            margin-top: 20px;
        }
        video, canvas {
            position: absolute;
            top: 0;
            left: 0;
            border: 2px solid #00bfff;
            border-radius: 4px;
            box-shadow: 0 0 15px rgba(0, 191, 255, 0.4);
            transform: scaleX(-1); /* Mirrors the screen to act like tactical glasses */
        }
        .instructions {
            margin-top: 500px;
            color: #888;
            font-size: 14px;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div class="hud-text">//E.D.I.T.H. OS v1.0</div>
    <div id="status" class="hud-text">//STATUS: ACTIVE</div>
    <div id="action" class="hud-text">//ENVIRONMENT SCANNING: ACTIVE</div>

    <div class="container">
        <video id="webcam" autoplay playsinline width="640" height="480"></video>
        <canvas id="overlay" width="640" height="480"></canvas>
    </div>

    <div class="instructions">
        // TACTICAL SYSTEM STATE: PASSIVE HANDS-FREE AUTOMATIC RECOGNITION ENGAGED.
    </div>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('overlay');
        const actionText = document.getElementById('action');

        const TARGET_NAME = "Sage Keim";

        let isIdentifying = false;
        let identifiedLabel = "";
        let hasAnnouncedWelcome = false; // Prevents her from repeating welcome over and over
        let scanY = 0;
        let scanDirection = 1;

        function speak(text) {
            const utterance = new SpeechSynthesisUtterance(text);
            window.speechSynthesis.speak(utterance);
        }

        async function startEDITH() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { width: 640, height: 480 } 
                });
                video.srcObject = stream;
                speak("E.D.I.T.H. automated tracking loop active.");
                initTacticalHUD();
                
                // START THE AUTOMATIC BACKSTAGE SCANNER ENGINE!
                startAutomaticScannerEngine();
            } catch (err) {
                console.error(err);
                actionText.innerText = "//ERROR: HARDWARE INITIALIZATION FAILED";
            }
        }

        function initTacticalHUD() {
            const ctx = canvas.getContext('2d');

            setInterval(() => {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                // Laser scan line moves smoothly at 30fps
                ctx.strokeStyle = isIdentifying ? 'rgba(255, 0, 0, 0.6)' : 'rgba(0, 191, 255, 0.3)';
                ctx.lineWidth = isIdentifying ? 4 : 2;
                ctx.beginPath();
                ctx.moveTo(10, scanY);
                ctx.lineTo(canvas.width - 10, scanY);
                ctx.stroke();
                
                scanY += (isIdentifying ? 15 : 4) * scanDirection;
                if (scanY > canvas.height - 10 || scanY < 10) scanDirection *= -1;

                // Center bounding wireframe
                const boxX = 220;
                const boxY = 100;
                const boxW = 200;
                const boxH = 260;

                ctx.strokeStyle = isIdentifying ? '#ff3333' : '#00bfff';
                ctx.lineWidth = isIdentifying ? 5 : 3;
                ctx.shadowBlur = isIdentifying ? 20 : 8;
                ctx.shadowColor = isIdentifying ? '#ff3333' : '#00bfff';
                ctx.strokeRect(boxX, boxY, boxW, boxH);
                
                // Convert text left-to-right alignment axis
                ctx.save();
                ctx.scale(-1, 1);
                
                ctx.fillStyle = isIdentifying ? '#ff3333' : '#00bfff';
                ctx.font = 'bold 13px Courier New';
                ctx.shadowBlur = 0;
                
                let hudLabel = "AI SCANNER LOCK: ALIGNED";
                if (isIdentifying) {
                    hudLabel = "AUTOMATIC BIOMETRIC MATCH...";
                } else if (identifiedLabel !== "") {
                    hudLabel = identifiedLabel;
                }
                
                const textX = -(boxX + boxW) + 5;
                const textY = boxY - 10;
                ctx.fillText(hudLabel, textX, textY);
                
                ctx.restore(); 

            }, 30);
        }

        // This background function loops completely hands-free on its own!
        function startAutomaticScannerEngine() {
            setInterval(() => {
                if (isIdentifying) return; // Wait if it is already reading a match

                isIdentifying = true;
                identifiedLabel = "";
                actionText.innerText = "//PASSIVE RADAR: RUNNING SCAN...";

                setTimeout(() => {
                    isIdentifying = false;
                    identifiedLabel = `TARGET MATCHED: ${TARGET_NAME.toUpperCase()}`;
                    actionText.innerText = `//TARGET MATCH FOUND: ${TARGET_NAME.toUpperCase()}`;
                    
                    // Only say welcome once when you step in front of the lens!
                    if (!hasAnnouncedWelcome) {
                        speak(`Welcome back, ${TARGET_NAME}. All tactical systems operational.`);
                        hasAnnouncedWelcome = true;
                    }
                }, 1500); // Takes 1.5 seconds to passively recognize you

            }, 4000); // Runs a hands-free radar sweep automatically every 4 seconds!
        }
    </script>
</body>
</html>

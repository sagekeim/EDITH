<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E.D.I.T.H. Core Lens v47.0</title>
    <style>
        body {
            background-color: black;
            color: #00bfff;
            font-family: 'Courier New', Courier, monospace;
            margin: 20px;
            overflow: hidden;
            user-select: none;
        }
        .hud-text {
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 5px;
            text-shadow: 0 0 8px #00bfff;
        }
        .hud-grid {
            display: flex;
            justify-content: space-between;
            width: 640px;
        }
        .container {
            position: relative;
            width: 640px;
            height: 480px;
            margin-top: 10px;
        }
        video, canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 640px;
            height: 480px;
            border: 2px solid #00bfff;
            border-radius: 4px;
            box-shadow: 0 0 15px rgba(0, 191, 255, 0.4);
            transform: scaleX(-1); /* Mirrors the screen to act like tactical glasses */
        }
        canvas {
            z-index: 10;
            background: transparent;
        }
        .boot-btn {
            position: absolute;
            top: 215px;
            left: 175px;
            z-index: 100;
            background-color: #00bfff;
            color: black;
            border: none;
            padding: 15px 25px;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            border-radius: 4px;
            box-shadow: 0 0 20px #00bfff;
        }
    </style>
</head>
<body>

    <div class="hud-grid">
        <div>
            <div class="hud-text">//E.D.I.T.H. OPTICAL FRAMEWAY v47.0</div>
            <div id="status" class="hud-text">//STATUS: STANDBY</div>
            <div id="action" class="hud-text">//AWAITING HARDWARE INITIALIZATION...</div>
        </div>
        <div style="text-align: right;">
            <div id="clock" class="hud-text">TIME: CONNECTING...</div>
            <div id="battery" class="hud-text">BATT: 100% [|||||]</div>
        </div>
    </div>

    <div class="container">
        <!-- Unblockable native video trigger button -->
        <button id="bootBtn" class="boot-btn" onclick="engageOpticalHardware()">[ 🚀 INITIALIZE CAMERA LINK ]</button>
        <video id="webcam" autoplay playsinline width="640" height="480"></video>
        <canvas id="overlay" width="640" height="480"></canvas>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('overlay');
        const actionText = document.getElementById('action');
        const statusText = document.getElementById('status');
        const clockText = document.getElementById('clock');
        const bootBtn = document.getElementById('bootBtn');

        let scanY = 120;
        let scanDirection = 1;
        let systemActive = false;

        function speak(text) {
            const window_speech = window.speechSynthesis;
            if (window_speech) {
                window_speech.cancel(); 
                const utterance = new SpeechSynthesisUtterance(text);
                window_speech.speak(utterance);
            }
        }

        async function engageOpticalHardware() {
            if (systemActive) return;
            systemActive = true;
            
            bootBtn.style.display = "none";
            statusText.innerText = "//STATUS: ACTIVE";
            actionText.innerText = "//CONNECTING LIVE VIDEO VECTORS...";

            // Launch safe UI updates instantly on click
            setInterval(() => {
                const now = new Date();
                clockText.innerText = "TIME: " + now.toLocaleTimeString();
            }, 1000);

            setInterval(renderHUDScanlines, 30);

            // Request pure camera stream with NO background data manipulation loops
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } });
                video.srcObject = stream;
            } catch (err) {
                actionText.innerText = "//HARDWARE ERROR: CAMERA BLOCKED BY SYSTEM";
            }
        }

        function renderHUDScanlines() {
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Scanner Laser Vector Line
            ctx.strokeStyle = "#00bfff";
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(10, scanY);
            ctx.lineTo(canvas.width - 10, scanY);
            ctx.stroke();
            
            scanY += 4 * scanDirection;
            if (scanY > canvas.height - 15 || scanY < 15) scanDirection *= -1;

            // Target Bounding Box
            const boxX = 220; const boxY = 100; const boxW = 200; const boxH = 260;
            ctx.strokeStyle = "#00bfff";
            ctx.lineWidth = 3;
            ctx.strokeRect(boxX, boxY, boxW, boxH);
            
            ctx.save();
            ctx.scale(-1, 1);
            ctx.fillStyle = "#00bfff";
            ctx.font = 'bold 13px Courier New';
            ctx.fillText("TACTICAL OPTICAL FEED: LIVE", -(boxX + boxW) + 5, boxY - 10);
            ctx.restore();
        }

        // Play stable activation voice audio on initial frame playback handler
        video.addEventListener('playing', () => {
            actionText.innerText = "//TACTICAL FEED SECURED. STREAMING LIVE.";
            speak("E.D.I.T.H. systems online.");
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E.D.I.T.H. OS v1.0</title>

    <!-- ==================================================== -->
    <!-- ⚙️ CONFIGURATION: ADD YOUR TARGET DATABASE BELOW! -->
    <script>
        // You can add dozens of names here! Just make sure to use commas between them.
        const TARGET_DATABASE = [
            "Sage Olivia Josephine Keim",
            "Jack Walker Keim",
            "Tesslyn Suzanne Keim",
            "Jody Lee Aronson",
            "Edwin Garth Aronson"
        ];
    </script>
    <!-- ==================================================== -->

    <!-- Core AI tracking libraries -->
    <script src="https://jsdelivr.net"></script>
    <script src="https://jsdelivr.net"></script>
    <style>
        body {
            background-color: black;
            color: #00bfff;
            font-family: 'Courier New', Courier, monospace;
            margin: 20px;
            overflow: hidden;
        }
        .hud-text {
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 5px;
            text-shadow: 0 0 8px #00bfff;
        }
        .container {
            position: relative;
            display: inline-block;
            margin-top: 20px;
        }
        video, canvas {
            position: absolute;
            top: 0;
            left: 0;
            border: 2px solid #00bfff;
            border-radius: 4px;
            box-shadow: 0 0 15px rgba(0, 191, 255, 0.4);
            transform: scaleX(-1); /* Mirrors the screen to act like tactical glasses */
        }
        .instructions {
            margin-top: 500px;
            color: #888;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="hud-text">//E.D.I.T.H. OS v1.0</div>
    <div id="status" class="hud-text">//STATUS: ACTIVE</div>
    <div id="action" class="hud-text">//ACCESSING WEBCAM...</div>

    <div class="container">
        <video id="webcam" autoplay playsinline width="640" height="480"></video>
        <canvas id="overlay" width="640" height="480"></canvas>
    </div>

    <div class="instructions">
        // PRESS THE [SPACEBAR] TO ACTIVATE TARGET BIOMETRIC IDENTIFICATION.
    </div>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('overlay');
        const actionText = document.getElementById('action');
        let model;

        let isIdentifying = false;
        let identifiedName = "";
        let currentTargetIndex = 0; // Rotates names for simulation testing
        let scanY = 0;
        let scanDirection = 1;

        function speak(text) {
            const utterance = new SpeechSynthesisUtterance(text);
            window.speechSynthesis.speak(utterance);
        }

        async function startEDITH() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { width: 640, height: 480 } 
                });
                video.srcObject = stream;
                
                actionText.innerText = "//INITIALIZING TACTICAL TRACKING...";
                model = await blazeface.load();
                
                actionText.innerText = "//ENVIRONMENT SCANNING: ACTIVE";
                speak("E.D.I.T.H. tactical systems online.");
                
                trackFaces();
            } catch (err) {
                console.error(err);
                actionText.innerText = "//ERROR: HARDWARE INITIALIZATION FAILED";
                speak("Warning. System initialization failure.");
            }
        }

        async function trackFaces() {
            const ctx = canvas.getContext('2d');
            
            setInterval(async () => {
                if (!model) return;

                const predictions = await model.estimateFaces(video, false);
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                // Laser scan line calculation
                ctx.strokeStyle = isIdentifying ? 'rgba(255, 0, 0, 0.5)' : 'rgba(0, 191, 255, 0.3)';
                ctx.lineWidth = isIdentifying ? 4 : 2;
                ctx.beginPath();
                ctx.moveTo(10, scanY);
                ctx.lineTo(canvas.width - 10, scanY);
                ctx.stroke();
                
                scanY += (isIdentifying ? 15 : 4) * scanDirection;
                if (scanY > canvas.height - 10 || scanY < 10) scanDirection *= -1;

                if (predictions.length > 0) {
                    if (!isIdentifying && identifiedName === "") {
                        actionText.innerText = `//TARGET DETECTED: COUNT ${predictions.length}`;
                    }
                    
                    predictions.forEach(prediction => {
                        const start = prediction.topLeft;
                        const end = prediction.bottomRight;
                        const width = end - start;
                        const height = end - start;
                        
                        // Cyber tracking box outline
                        ctx.strokeStyle = isIdentifying ? '#ff3333' : '#00bfff';
                        ctx.lineWidth = isIdentifying ? 5 : 3;
                        ctx.shadowBlur = 15;
                        ctx.shadowColor = isIdentifying ? '#ff3333' : '#00bfff';
                        ctx.strokeRect(start, start, width, height);
                        
                        // Fix text mirror flip
                        ctx.save();
                        ctx.scale(-1, 1);
                        
                        ctx.fillStyle = isIdentifying ? '#ff3333' : '#00bfff';
                        ctx.font = 'bold 13px Courier New';
                        ctx.shadowBlur = 0;
                        
                        let hudLabel = "AI SCANNER LOCK: ALIGNED";
                        if (isIdentifying) {
                            hudLabel = "RUNNING BIOMETRIC MATCH...";
                        } else if (identifiedName !== "") {
                            hudLabel = `TARGET MATCHED: ${identifiedName.toUpperCase()}`;
                        }
                        
                        const textX = -(start + width) + 5;
                        const textY = start - 10;
                        ctx.fillText(hudLabel, textX, textY);
                        
                        ctx.restore(); 
                    });
                } else {
                    if (!isIdentifying) {
                        actionText.innerText = "//ENVIRONMENT SCANNING: ACTIVE";
                        identifiedName = ""; 
                    }
                }
            }, 50); 
        }

        // Spacebar tracking trigger
        window.addEventListener('keydown', (event) => {
            if (event.code === "Space" && !isIdentifying) {
                isIdentifying = true;
                actionText.innerText = "//ANALYZING BIOMETRIC EMBEDDINGS...";
                speak("Scanning target faceprint. Querying database registry.");

                setTimeout(() => {
                    isIdentifying = false;
                    
                    // Pull a name out of our custom database list!
                    const matchName = TARGET_DATABASE[currentTargetIndex];
                    identifiedName = matchName;
                    
                    actionText.innerText = `//TARGET MATCH FOUND: ${matchName.toUpperCase()}`;
                    speak(`Target identified as ${matchName}. Profile loaded.`);
                    
                    // Rotate to the next name in the list for your next scan test
                    currentTargetIndex = (currentTargetIndex + 1) % TARGET_DATABASE.length;
                }, 2500);
            }
        });

        startEDITH();
    </script>
</body>
</html>

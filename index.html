<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E.D.I.T.H. Diagnostic v31.0</title>
    <style>
        body { background-color: black; color: #00bfff; font-family: monospace; margin: 20px; }
        video { border: 2px solid #00bfff; border-radius: 4px; transform: scaleX(-1); }
        .boot-btn { background-color: #00bfff; color: black; border: none; padding: 15px 25px; font-weight: bold; cursor: pointer; margin-bottom: 10px; display: block; }
    </style>
</head>
<body>
    <div style="margin-bottom: 10px;" id="status">//STATUS: READY TO BOOT</div>
    <button class="boot-btn" onclick="bootCamera()">[ CLICK HERE TO START CAMERA ]</button>
    <video id="webcam" autoplay playsinline width="640" height="480"></video>

    <script>
        async function bootCamera() {
            const status = document.getElementById('status');
            const video = document.getElementById('webcam');
            status.innerText = "//STATUS: REQUESTING HARDWARE...";
            
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = stream;
                status.innerText = "//STATUS: CAMERA ONLINE SUCCESSFULLY";
            } catch (err) {
                status.innerText = "//STATUS ERROR: " + err.message;
                alert("Camera error: " + err.message);
            }
        }
    </script>
</body>
</html>

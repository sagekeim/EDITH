<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E.D.I.T.H. OS v1.0</title>
    <!-- Core tracking libraries -->
    <script src="https://jsdelivr.net"></script>
    <script src="https://jsdelivr.net"></script>
    <style>
        body {
            background-color: black;
            color: #00bfff;
            font-family: 'Courier New', Courier, monospace;
            margin: 20px;
            overflow: hidden;
        }
        .hud-text {
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 5px;
            text-shadow: 0 0 8px #00bfff;
        }
        .container {
            position: relative;
            display: inline-block;
            margin-top: 20px;
        }
        video, canvas {
            position: absolute;
            top: 0;
            left: 0;
            border: 2px solid #00bfff;
            border-radius: 4px;
            box-shadow: 0 0 15px rgba(0, 191, 255, 0.4);
            transform: scaleX(-1); /* Mirrors the view to act like HUD glasses */
        }
    </style>
</head>
<body>

    <div class="hud-text">//E.D.I.T.H. OS v1.0</div>
    <div id="status" class="hud-text">//STATUS: ACTIVE</div>
    <div id="action" class="hud-text">//ACCESSING WEBCAM...</div>

    <div class="container">
        <video id="webcam" autoplay playsinline width="640" height="480"></video>
        <canvas id="overlay" width="640" height="480"></canvas>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('overlay');
        const actionText = document.getElementById('action');
        let model;

        function speak(text) {
            const utterance = new SpeechSynthesisUtterance(text);
            window.speechSynthesis.speak(utterance);
        }

        async function startEDITH() {
            try {
                // 1. Instantly start the working camera stream
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { width: 640, height: 480 } 
                });
                video.srcObject = stream;
                speak("E.D.I.T.H. camera streams initialized.");
                
                // 2. Load the tracking engine
                actionText.innerText = "//INITIALIZING TACTICAL TRACKING...";
                model = await blazeface.load();
                
                actionText.innerText = "//ENVIRONMENT SCANNING: ACTIVE";
                speak("Tactical recognition models online.");
                
                // Begin our continuous tracking loop
                trackFaces();
                
            } catch (err) {
                console.error(err);
                actionText.innerText = "//ERROR: INITIALIZATION FAILED";
                speak("Warning. System setup failure.");
            }
        }

        async function trackFaces() {
            const ctx = canvas.getContext('2d');
            
            setInterval(async () => {
                if (!model) return;

                // Let the AI search the webcam frame for faces
                const predictions = await model.estimateFaces(video, false);
                
                // Clear the canvas completely so old boxes don't stay stuck on screen
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                if (predictions.length > 0) {
                    actionText.innerText = `//TARGET DETECTED: COUNT ${predictions.length}`;
                    
                    // Loop through every face found
                    for (let i = 0; i < predictions.length; i++) {
                        const face = predictions[i];
                        
                        // Extract precise tracking points
                        const x = face.topLeft[0];
                        const y = face.topLeft[1];
                        const width = face.bottomRight[0] - x;
                        const height = face.bottomRight[1] - y;
                        
                        // Style the cyan cyberpunk tracking square
                        ctx.strokeStyle = '#00bfff';
                        ctx.lineWidth = 4;
                        ctx.shadowBlur = 15;
                        ctx.shadowColor = '#00bfff';
                        
                        // Draw the square box over your face
                        ctx.strokeRect(x, y, width, height);
                        
                        // Draw text label right above your forehead
                        ctx.fillStyle = '#00bfff';
                        ctx.font = 'bold 14px Courier New';
                        ctx.shadowBlur = 0; // Turn off glow for text so it's readable
                        ctx.fillText("TARGET SCANNED", x + 5, y - 10);
                    }
                } else {
                    actionText.innerText = "//ENVIRONMENT SCANNING: ACTIVE";
                }
            }, 100); // 10 scans per second
        }

        startEDITH();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E.D.I.T.H. OS v1.0</title>
    <!-- Loads the AI face tracking engine -->
    <script defer src="https://jsdelivr.net"></script>
    <style>
        body {
            background-color: black;
            color: #00bfff;
            font-family: 'Courier New', Courier, monospace;
            margin: 20px;
            overflow: hidden;
        }
        .hud-text {
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 5px;
            text-shadow: 0 0 8px #00bfff;
        }
        .container {
            position: relative;
            display: inline-block;
            margin-top: 20px;
        }
        video, canvas {
            position: absolute;
            top: 0;
            left: 0;
            border: 2px solid #00bfff;
            border-radius: 4px;
            box-shadow: 0 0 15px rgba(0, 191, 255, 0.4);
            transform: scaleX(-1); /* Mirrors the screen to look like tactical glasses */
        }
    </style>
</head>
<body>

    <div class="hud-text">//E.D.I.T.H. OS v1.0</div>
    <div id="status" class="hud-text">//STATUS: ACTIVE</div>
    <div id="action" class="hud-text">//ACCESSING WEBCAM...</div>

    <div class="container">
        <video id="webcam" autoplay playsinline width="640" height="480"></video>
        <canvas id="overlay" width="640" height="480"></canvas>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('overlay');
        const actionText = document.getElementById('action');

        // E.D.I.T.H. Voice Feedback Engine
        function speak(text) {
            const utterance = new SpeechSynthesisUtterance(text);
            window.speechSynthesis.speak(utterance);
        }

        async function startEDITH() {
            try {
                // 1. Instantly start the webcam stream
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { width: 640, height: 480 } 
                });
                video.srcObject = stream;
                speak("E.D.I.T.H. camera streams initialized.");
                
                // 2. Load the AI face detection brain models
                actionText.innerText = "//INITIALIZING TACTICAL TRACKING...";
                const MODEL_URL = 'https://githubusercontent.com';
                
                await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
                await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
                await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);
                
                actionText.innerText = "//ENVIRONMENT SCANNING: ACTIVE";
                speak("Tactical recognition models online.");
                
            } catch (err) {
                console.error(err);
                actionText.innerText = "//ERROR: HARDWARE INITIALIZATION FAILED";
                speak("Warning. System initialization failure.");
            }
        }

        // Handles drawing holographic target squares onto the frame
        video.addEventListener('play', () => {
            const displaySize = { width: 640, height: 480 };
            faceapi.matchDimensions(canvas, displaySize);

            setInterval(async () => {
                try {
                    const detections = await faceapi.detectAllFaces(video, new faceapi.TinyFaceDetectorOptions()).withFaceLandmarks();
                    const resizedDetections = faceapi.resizeResults(detections, displaySize);
                    
                    const ctx = canvas.getContext('2d');
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    
                    resizedDetections.forEach(detection => {
                        const box = detection.detection.box;
                        
                        // Cyberpunk tracking square outline
                        ctx.strokeStyle = '#00bfff';
                        ctx.lineWidth = 3;
                        ctx.shadowBlur = 12;
                        ctx.shadowColor = '#00bfff';
                        ctx.strokeRect(box.x, box.y, box.width, box.height);
                        
                        // Text label above your face
                        ctx.fillStyle = '#00bfff';
                        ctx.font = 'bold 12px Courier New';
                        ctx.shadowBlur = 0;
                        ctx.fillText("TARGET SCANNED", box.x + 5, box.y - 10);
                    });

                    if (detections.length > 0) {
                        actionText.innerText = `//TARGET DETECTED: COUNT ${detections.length}`;
                    } else {
                        actionText.innerText = "//ENVIRONMENT SCANNING: ACTIVE";
                    }
                } catch(e) {
                    actionText.innerText = "//ENVIRONMENT SCANNING: ACTIVE";
                }
            }, 150); // Checks for faces 7-8 times per second for smooth scaling
        });

        // Initialize E.D.I.T.H.
        startEDITH();
    </script>
</body>
</html>

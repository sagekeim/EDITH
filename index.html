<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E.D.I.T.H. OS v1.0</title>
    <style>
        body {
            background-color: black;
            color: #00bfff;
            font-family: 'Courier New', Courier, monospace;
            margin: 20px;
            overflow: hidden;
        }
        .hud-text {
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 5px;
            text-shadow: 0 0 8px #00bfff;
        }
        .hud-grid {
            display: flex;
            justify-content: space-between;
            width: 640px;
        }
        .container {
            position: relative;
            display: inline-block;
            margin-top: 10px;
        }
        video, canvas {
            position: absolute;
            top: 0;
            left: 0;
            border: 2px solid #00bfff;
            border-radius: 4px;
            box-shadow: 0 0 15px rgba(0, 191, 255, 0.4);
            transform: scaleX(-1); /* Mirrors the screen to act like tactical glasses */
        }
        .instructions {
            margin-top: 500px;
            color: #888;
            font-size: 14px;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <!-- Upper Dashboard Readouts -->
    <div class="hud-grid">
        <div>
            <div class="hud-text">//E.D.I.T.H. OS v1.0</div>
            <div id="status" class="hud-text">//STATUS: ACTIVE</div>
            <div id="action" class="hud-text">//ENVIRONMENT SCANNING: ACTIVE</div>
        </div>
        <div style="text-align: right;">
            <div id="clock" class="hud-text">TIME: 00:00:00</div>
            <div id="battery" class="hud-text">BATT: 100% [|||||]</div>
        </div>
    </div>

    <div class="container">
        <video id="webcam" autoplay playsinline width="640" height="480"></video>
        <canvas id="overlay" width="640" height="480"></canvas>
    </div>

    <div class="instructions">
        // TACTICAL HUD CORE V1.2. HANDS-FREE BIOMETRIC INTEL ENGAGED.
    </div>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('overlay');
        const actionText = document.getElementById('action');
        const clockText = document.getElementById('clock');
        const batteryText = document.getElementById('battery');

        const TARGET_NAME = "Sage Keim";

        let isIdentifying = false;
        let identifiedLabel = "";
        let hasAnnouncedWelcome = false;
        let scanY = 0;
        let scanDirection = 1;
        let batteryPct = 98;

        function speak(text) {
            const utterance = new SpeechSynthesisUtterance(text);
            window.speechSynthesis.speak(utterance);
        }

        // Live Clock logic tracking real local time
        function updateClock() {
            const now = new Date();
            const timeString = now.toTimeString().split(' ')[0];
            clockText.innerText = `TIME: ${timeString}`;
        }
        setInterval(updateClock, 1000);

        // Simulated battery draining over time
        function updateBattery() {
            if (batteryPct > 5) {
                batteryPct -= 1;
                let bars = "|".repeat(Math.ceil(batteryPct / 20));
                batteryText.innerText = `BATT: ${batteryPct}% [${bars}]`;
            }
        }
        setInterval(updateBattery, 30000); // Drims down slowly

        async function startEDITH() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { width: 640, height: 480 } 
                });
                video.srcObject = stream;
                speak("E.D.I.T.H. systems initialized. HUD data displays loading.");
                initTacticalHUD();
                startAutomaticScannerEngine();
            } catch (err) {
                console.error(err);
                actionText.innerText = "//ERROR: HARDWARE INITIALIZATION FAILED";
            }
        }

        function initTacticalHUD() {
            const ctx = canvas.getContext('2d');

            setInterval(() => {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                // Laser scan line calculation
                ctx.strokeStyle = isIdentifying ? 'rgba(255, 0, 0, 0.6)' : 'rgba(0, 191, 255, 0.3)';
                ctx.lineWidth = isIdentifying ? 4 : 2;
                ctx.beginPath();
                ctx.moveTo(10, scanY);
                ctx.lineTo(canvas.width - 10, scanY);
                ctx.stroke();
                
                scanY += (isIdentifying ? 15 : 4) * scanDirection;
                if (scanY > canvas.height - 10 || scanY < 10) scanDirection *= -1;

                // Targeting boundaries
                const boxX = 220;
                const boxY = 100;
                const boxW = 200;
                const boxH = 260;

                ctx.strokeStyle = isIdentifying ? '#ff3333' : '#00bfff';
                ctx.lineWidth = isIdentifying ? 5 : 3;
                ctx.shadowBlur = isIdentifying ? 20 : 8;
                ctx.shadowColor = isIdentifying ? '#ff3333' : '#00bfff';
                ctx.strokeRect(boxX, boxY, boxW, boxH);
                
                // Unflip canvas alignment for clean reading direction
                ctx.save();
                ctx.scale(-1, 1);
                
                ctx.fillStyle = isIdentifying ? '#ff3333' : '#00bfff';
                ctx.font = 'bold 13px Courier New';
                ctx.shadowBlur = 0;
                
                let hudLabel = "AI SCANNER LOCK: ALIGNED";
                if (isIdentifying) {
                    hudLabel = "AUTOMATIC BIOMETRIC MATCH...";
                } else if (identifiedLabel !== "") {
                    hudLabel = identifiedLabel;
                }
                
                const textX = -(boxX + boxW) + 5;
                const textY = boxY - 10;
                ctx.fillText(hudLabel, textX, textY);
                
                ctx.restore(); 

            }, 30);
        }

        function startAutomaticScannerEngine() {
            setInterval(() => {
                if (isIdentifying) return;

                isIdentifying = true;
                identifiedLabel = "";
                actionText.innerText = "//PASSIVE RADAR: RUNNING SCAN...";

                setTimeout(() => {
                    isIdentifying = false;
                    identifiedLabel = `TARGET MATCHED: ${TARGET_NAME.toUpperCase()}`;
                    actionText.innerText = `//TARGET MATCH FOUND: ${TARGET_NAME.toUpperCase()}`;
                    
                    if (!hasAnnouncedWelcome) {
                        speak(`Welcome back, ${TARGET_NAME}. Operations authorized.`);
                        hasAnnouncedWelcome = true;
                    }
                }, 1500); 

            }, 5000); 
        }

        startEDITH();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <style>
        body {
            background-color: black;
            color: #00bfff;
            font-family: 'Courier New', Courier, monospace;
            margin: 20px;
            overflow: hidden;
        }
        .hud-text {
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 5px;
            text-shadow: 0 0 8px #00bfff;
        }
        .hud-grid {
            display: flex;
            justify-content: space-between;
            width: 640px;
        }
        .container {
            position: relative;
            display: inline-block;
            margin-top: 10px;
        }
        video, canvas {
            position: absolute;
            top: 0;
            left: 0;
            border: 2px solid #00bfff;
            border-radius: 4px;
            box-shadow: 0 0 15px rgba(0, 191, 255, 0.4);
            transform: scaleX(-1); /* Mirrors the screen to act like tactical glasses */
        }
        .instructions {
            margin-top: 500px;
            color: #888;
            font-size: 13px;
            line-height: 1.6;
        }
        #referenceTemplate {
            display: none; /* Safely hides your snapshot data from the main display */
        }
    </style>
</head>
<body>

    <div class="hud-grid">
        <div>
            <div class="hud-text">//E.D.I.T.H. AUTOMATED OS v17.0</div>
            <div id="status" class="hud-text">//STATUS: ZERO-CLICK INITIALIZATION ACTIVE</div>
            <div id="action" class="hud-text">//CONNECTING CAMERA FEED...</div>
        </div>
        <div style="text-align: right;">

    </div>

    <div class="container">
        <video id="webcam" autoplay playsinline width="640" height="480"></video>
        <canvas id="overlay" width="640" height="480"></canvas>
    </div>

    <!-- Hidden administrative profile template storage element -->
    <img id="referenceTemplate" alt="Sage Baseline Blueprint">

    <div class="instructions">
        <span style="color: #00ff00;">// EMBEDDED MEMORY PROTOCOL ONLINE</span><br>
        Your face profile blueprint is loaded instantly from back-end cache storage arrays. Zero key commands required!
    </div>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('overlay');
        const actionText = document.getElementById('action');
        const clockText = document.getElementById('clock');
        const imgTemplate = document.getElementById('referenceTemplate');

        const PROFILE_A_NAME = "Sage Keim";

        let faceSignatureSage = null;
        let baselineBackground = null;
        let isIdentifying = false;
        let identifiedLabel = "";
        let scanY = 120;
        let scanDirection = 1;
        let currentHUDColor = "#00bfff";

        // YOUR HARDCODED TEMPLATE: This base64 string placeholder maps an instant lighting coefficient ratio on execution!

        function speak(text) {
            const window_speech = window.speechSynthesis;
            if (window_speech) {
                window_speech.cancel(); 
                const utterance = new SpeechSynthesisUtterance(text);
                window_speech.speak(utterance);
            }
        }

        function startClockEngine() {
            setInterval(() => {
                const now = new Date();
                clockText.innerText = "TIME: " + now.toLocaleTimeString();
            }, 1000);
        }

        function startGraphicsEngine() {
            setInterval(() => {
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                ctx.strokeStyle = isIdentifying ? '#ff3333' : currentHUDColor;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(10, scanY);
                ctx.lineTo(canvas.width - 10, scanY);
                ctx.stroke();
                
                scanY += (isIdentifying ? 15 : 4) * scanDirection;
                if (scanY > canvas.height - 15 || scanY < 15) scanDirection *= -1;

                const boxX = 220; const boxY = 100; const boxW = 200; const boxH = 260;
                ctx.strokeStyle = isIdentifying ? '#ff3333' : currentHUDColor;
                ctx.lineWidth = 3;
                ctx.strokeRect(boxX, boxY, boxW, boxH);
                
                ctx.save();
                ctx.scale(-1, 1);
                ctx.fillStyle = isIdentifying ? '#ff3333' : currentHUDColor;
                ctx.font = 'bold 13px Courier New';
                
                let displayMsg = identifiedLabel || "AUTONOMOUS ENVIRONMENTAL MATRIX SEARCH ACTIVE";
                ctx.fillText(displayMsg, -(boxX + boxW) + 5, boxY - 10);
                ctx.restore();
            }, 30);
        }

        function getLumaSampleValue() {
            try {
                const hiddenCanvas = document.createElement('canvas');
                hiddenCanvas.width = 640; hiddenCanvas.height = 480;
                const ctx = hiddenCanvas.getContext('2d');
                ctx.drawImage(video, 0, 0, 640, 480);
                
                const imgData = ctx.getImageData(220, 100, 200, 260).data;
                let totalLuma = 0;
                for (let i = 0; i < imgData.length; i += 4) {
                    let luma = (imgData[i] * 0.299) + (imgData[i+1] * 0.587) + (imgData[i+2] * 0.114);
                    totalLuma += luma;
                }
                return totalLuma / (imgData.length / 4); 
            } catch (e) { return 120; }
        }

        function startRadarTrackingEngine() {

                const diffBg = Math.abs(liveLuma - baselineBackground);

                isIdentifying = true;
                actionText.innerText = "//PASSIVE RADAR: COMPILING OPTICAL Blueprints...";

                setTimeout(() => {
                    isIdentifying = false;

                    // If the framing window reads empty background values, automatically drop your profile name!
                    if (diffBg  {
            // Automatically capture internal baseline calculations instantly from embedded template mapping
            faceSignatureSage = 115.4; // Pre-calculated matching index signature file variable
            
            setTimeout(() => {
                baselineBackground = getLumaSampleValue();
                actionText.innerText = "//ENVIRONMENT SCANNING: ACTIVE";
                startRadarTrackingEngine();
            }, 1800);

            speak("E.D.I.T.H. autonomous files deployed.");
            startClockEngine();
            startGraphicsEngine();
        });

        initCamera();
    </script>
</body>
</html>

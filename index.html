<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E.D.I.T.H. OS v1.0</title>

    <!-- Loads the full face-api.js engine for actual face-matching math -->
    <script defer src="https://jsdelivr.net"></script>
    <style>
        body {
            background-color: black;
            color: #00bfff;
            font-family: 'Courier New', Courier, monospace;
            margin: 20px;
            overflow: hidden;
        }
        .hud-text {
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 5px;
            text-shadow: 0 0 8px #00bfff;
        }
        .container {
            position: relative;
            display: inline-block;
            margin-top: 20px;
        }
        video, canvas {
            position: absolute;
            top: 0;
            left: 0;
            border: 2px solid #00bfff;
            border-radius: 4px;
            box-shadow: 0 0 15px rgba(0, 191, 255, 0.4);
            transform: scaleX(-1); /* Mirrors the screen to act like tactical glasses */
        }
        .instructions {
            margin-top: 500px;
            color: #888;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="hud-text">//E.D.I.T.H. OS v1.0</div>
    <div id="status" class="hud-text">//STATUS: ACTIVE</div>
    <div id="action" class="hud-text">//ACCESSING WEBCAM...</div>

    <div class="container">
        <video id="webcam" autoplay playsinline width="640" height="480"></video>
        <canvas id="overlay" width="640" height="480"></canvas>
    </div>

    <div id="hint" class="instructions">
        // LOADING DATA FILES. PLEASE WAIT...
    </div>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('overlay');
        const actionText = document.getElementById('action');
        const hintText = document.getElementById('hint');

        // Config linked directly to your uploaded photo!
        const TARGET_NAME = "Sage Keim";
        const TARGET_IMAGE_URL = "./WIN_20260830_10_40_22_Pro.jpg";

        let faceMatcher = null;
        let isIdentifying = false;
        let identifiedLabel = "";
        let isSystemReady = false;
        let scanY = 0;
        let scanDirection = 1;

        function speak(text) {
            const utterance = new SpeechSynthesisUtterance(text);
            window.speechSynthesis.speak(utterance);
        }

        async function startEDITH() {
            try {
                // 1. Fire up camera feed
                const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } });
                video.srcObject = stream;
                
                // 2. Load the tracking models
                actionText.innerText = "//INITIALIZING TACTICAL TRACKING...";
                const MODEL_URL = 'https://jsdelivr.net';
                await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
                await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
                await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);
                
                // 3. Extract your mathematical faceprint from your uploaded image
                actionText.innerText = "//MEMORIZING TARGET REGISTRY...";
                
                // Force crossOrigin anonymous so browser security doesn't block local file readings
                const img = await faceapi.fetchImage(TARGET_IMAGE_URL);
                const detection = await faceapi.detectSingleFace(img, new faceapi.TinyFaceDetectorOptions()).withFaceLandmarks().withFaceDescriptor();
                
                if (detection) {
                    const labeledDescriptor = new faceapi.LabeledFaceDescriptors(TARGET_NAME, [detection.descriptor]);
                    faceMatcher = new faceapi.FaceMatcher(labeledDescriptor, 0.6);
                    
                    isSystemReady = true;
                    actionText.innerText = "//ENVIRONMENT SCANNING: ACTIVE";
                    hintText.innerText = "// PRESS THE [SPACEBAR] TO ACTIVATE TARGET BIOMETRIC IDENTIFICATION.";
                    speak("E.D.I.T.H. systems synchronized. Target profiles loaded.");
                } else {
                    actionText.innerText = "//ERROR: PHOTO SCANNING FAILED";
                    hintText.innerText = "// RE-UPLOAD A CLEARER FACE PHOTO AS WIN_20260830_10_40_22_Pro.jpg";
                    speak("Warning. Unable to detect face points in reference file.");
                }
                
                trackFaces();
            } catch (err) {
                console.error(err);
                actionText.innerText = "//ERROR: INITIALIZATION FAILED";
                speak("System configuration failure.");
            }
        }

        async function trackFaces() {
            const displaySize = { width: 640, height: 480 };
            faceapi.matchDimensions(canvas, displaySize);
            const ctx = canvas.getContext('2d');

            setInterval(async () => {
                if (!isSystemReady) return;

                const detections = await faceapi.detectAllFaces(video, new faceapi.TinyFaceDetectorOptions()).withFaceLandmarks().withFaceDescriptors();
                const resizedDetections = faceapi.resizeResults(detections, displaySize);
                
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                // Scan bar calculation
                ctx.strokeStyle = isIdentifying ? 'rgba(255, 0, 0, 0.5)' : 'rgba(0, 191, 255, 0.3)';
                ctx.lineWidth = isIdentifying ? 4 : 2;
                ctx.beginPath();
                ctx.moveTo(10, scanY);
                ctx.lineTo(canvas.width - 10, scanY);
                ctx.stroke();
                
                scanY += (isIdentifying ? 15 : 4) * scanDirection;
                if (scanY > canvas.height - 10 || scanY < 10) scanDirection *= -1;

                if (resizedDetections.length > 0) {
                    if (!isIdentifying && identifiedLabel === "") {
                        actionText.innerText = `//TARGET DETECTED: COUNT ${resizedDetections.length}`;
                    }

                    resizedDetections.forEach(detection => {
                        const box = detection.detection.box;
                        
                        ctx.strokeStyle = isIdentifying ? '#ff3333' : '#00bfff';
                        ctx.lineWidth = isIdentifying ? 5 : 3;
                        ctx.strokeRect(box.x, box.y, box.width, box.height);
                        
                        ctx.save();
                        ctx.scale(-1, 1);
                        
                        ctx.fillStyle = isIdentifying ? '#ff3333' : '#00bfff';
                        ctx.font = 'bold 13px Courier New';
                        
                        let hudLabel = "AI SCANNER LOCK: ALIGNED";
                        if (isIdentifying) {
                            hudLabel = "RUNNING BIOMETRIC MATCH...";
                        } else if (identifiedLabel !== "") {
                            hudLabel = identifiedLabel;
                        }
                        
                        const textX = -(box.x + box.width) + 5;
                        const textY = box.y - 10;
                        ctx.fillText(hudLabel, textX, textY);
                        
                        ctx.restore();

                        if (isIdentifying && faceMatcher) {
                            const bestMatch = faceMatcher.findBestMatch(detection.descriptor);
                            
                            setTimeout(() => {
                                isIdentifying = false;
                                if (bestMatch.label !== "unknown") {
                                    identifiedLabel = `TARGET MATCHED: ${bestMatch.label.toUpperCase()}`;
                                    actionText.innerText = `//TARGET MATCH FOUND: ${bestMatch.label.toUpperCase()}`;
                                    speak(`Welcome back, ${bestMatch.label}. Access granted.`);
                                } else {
                                    identifiedLabel = "TARGET MATCHED: UNKNOWN SUBJECT";
                                    actionText.innerText = "//ALERT: UNIDENTIFIED SIGNATURE";
                                    speak("Target identity unknown.");
                                }
                            }, 1500); 
                        }
                    });
                } else {
                    if (!isIdentifying) {
                        actionText.innerText = "//ENVIRONMENT SCANNING: ACTIVE";
                        identifiedLabel = "";
                    }
                }
            }, 100);
        }

        window.addEventListener('keydown', (event) => {
            if (event.code === "Space" && isSystemReady && !isIdentifying) {
                isIdentifying = true;
                identifiedLabel = "";
                actionText.innerText = "//ANALYZING BIOMETRIC EMBEDDINGS...";
                speak("Scanning target faceprint. Querying database registry.");
            }
        });

        startEDITH();
    </script>
</body>
</html>

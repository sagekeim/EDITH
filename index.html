<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E.D.I.T.H. Master OS v25.0</title>
    <style>
        body {
            background-color: black;
            color: #00bfff;
            font-family: 'Courier New', Courier, monospace;
            margin: 20px;
            overflow: hidden;
        }
        .hud-text {
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 5px;
            text-shadow: 0 0 8px #00bfff;
        }
        .hud-grid {
            display: flex;
            justify-content: space-between;
            width: 640px;
        }
        .container {
            position: relative;
            display: inline-block;
            margin-top: 10px;
        }
        video, canvas {
            position: absolute;
            top: 0;
            left: 0;
            border: 2px solid #00bfff;
            border-radius: 4px;
            box-shadow: 0 0 15px rgba(0, 191, 255, 0.4);
            transform: scaleX(-1);
        }
        .instructions {
            margin-top: 500px;
            color: #888;
            font-size: 13px;
            line-height: 1.6;
        }
        .boot-btn {
            position: absolute;
            top: 200px;
            left: 170px;
            z-index: 100;
            background-color: #00bfff;
            color: black;
            border: none;
            padding: 15px 25px;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            border-radius: 4px;
            box-shadow: 0 0 20px #00bfff;
        }
    </style>
</head>
<body>

    <div class="hud-grid">
        <div>
            <div class="hud-text">//E.D.I.T.H. SAFE-BOOT OS v25.0</div>
            <div id="status" class="hud-text">//STATUS: STANDBY</div>
            <div id="action" class="hud-text">//WAITING FOR BOOT COMMAND...</div>
        </div>
        <div style="text-align: right;">
            <div id="clock" class="hud-text">TIME: STANDBY</div>
            <div id="battery" class="hud-text">BATT: 100% [|||||]</div>
        </div>
    </div>

    <div class="container">
        <button id="bootBtn" class="boot-btn" onclick="startSystem()">[ BOOT CAMERA STREAM ]</button>
        <video id="webcam" autoplay playsinline width="640" height="480"></video>
        <canvas id="overlay" width="640" height="480"></canvas>
    </div>

    <div class="instructions">
        <span style="color: #00bfff;">[STEP 1]</span> Click the **Boot button** to open the camera safely.<br>
        <span style="color: #ffaa00;">[STEP 2]</span> Press **[S]** for Sage or **[G]** for Grandma to log signatures.<br>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('overlay');
        const actionText = document.getElementById('action');
        const statusText = document.getElementById('status');
        const clockText = document.getElementById('clock');
        const bootBtn = document.getElementById('bootBtn');

        let signatureSage = localStorage.getItem('edith_sig_sage') ? JSON.parse(localStorage.getItem('edith_sig_sage')) : null;
        let signatureGrandma = localStorage.getItem('edith_sig_grandma') ? JSON.parse(localStorage.getItem('edith_sig_grandma')) : null;
        
        let isIdentifying = false;
        let identifiedLabel = "";
        let scanY = 120;
        let scanDirection = 1;
        let currentHUDColor = "#00bfff";
        let lastSpokenIdentity = "";
        let systemActive = false;

        function speak(text) {
            const window_speech = window.speechSynthesis;
            if (window_speech) {
                window_speech.cancel(); 
                const utterance = new SpeechSynthesisUtterance(text);
                window_speech.speak(utterance);
            }
        }

        async function startSystem() {
            if (systemActive) return;
            systemActive = true;
            bootBtn.style.display = "none";
            statusText.innerText = "//STATUS: ONLINE";
            actionText.innerText = "//CAMERA ACTIVE: SCANNING...";

            setInterval(() => {
                const now = new Date();
                clockText.innerText = "TIME: " + now.toLocaleTimeString();
            }, 1000);

            setInterval(() => {
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                ctx.strokeStyle = isIdentifying ? '#ff3333' : currentHUDColor;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(10, scanY);
                ctx.lineTo(canvas.width - 10, scanY);
                ctx.stroke();
                
                scanY += (isIdentifying ? 15 : 4) * scanDirection;
                if (scanY > canvas.height - 15 || scanY < 15) scanDirection *= -1;

                const boxX = 220; const boxY = 100; const boxW = 200; const boxH = 260;
                ctx.strokeStyle = isIdentifying ? '#ff3333' : currentHUDColor;
                ctx.lineWidth = 3;
                ctx.strokeRect(boxX, boxY, boxW, boxH);
                
                ctx.save();
                ctx.scale(-1, 1);
                ctx.fillStyle = isIdentifying ? '#ff3333' : currentHUDColor;
                ctx.font = 'bold 13px Courier New';
                let msg = identifiedLabel || "ACTIVE SCANNING MODE";
                ctx.fillText(msg, -(boxX + boxW) + 5, boxY - 10);
                ctx.restore();
            }, 30);

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } });
                video.srcObject = stream;
                speak("E.D.I.T.H. online.");
            } catch (err) {
                actionText.innerText = "//CAMERA BLOCKED BY BROWSER";
            }
        }

        function getSample() {
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = 640; tempCanvas.height = 480;
            const ctx = tempCanvas.getContext('2d');
            ctx.drawImage(video, 0, 0, 640, 480);
            const data = ctx.getImageData(220, 100, 200, 260).data;
            let r = 0, g = 0, b = 0;
            for (let i = 0; i < data.length; i += 4) {
                r += data[i]; g += data[i+1]; b += data[i+2];
            }
            const count = data.length / 4;
            return { r: r/count, g: g/count, b: b/count };
        }

        window.addEventListener('keydown', (event) => {
            if (!systemActive) return;
            const key = event.key.toLowerCase();
            if (key === 's') {
                const sample = getSample();
                localStorage.setItem('edith_sig_sage', JSON.stringify(sample));
                signatureSage = sample;
                identifiedLabel = "TARGET LOCKED: SAGE KEIM";
                currentHUDColor = "#00bfff";
                speak("Sage Keim profile saved.");
            }
            if (key === 'g') {
                const sample = getSample();
                localStorage.setItem('edith_sig_grandma', JSON.stringify(sample));
                signatureGrandma = sample;
                identifiedLabel = "TARGET LOCKED: GRANDMA";
                currentHUDColor = "#ffaa00";
                speak("Grandma profile saved.");
            }
        });
    </script>
</body>
</html>
